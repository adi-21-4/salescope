[project]
name = "salescope-backend"
version = "0.1.0"
description = "Sales data insights & dashboard API for local shops"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt<4.1",  # passlib 1.7.4's self-test is incompatible with bcrypt>=4.1's stricter API
    "python-multipart>=0.0.12",
    "statsmodels>=0.14",
    "anthropic>=0.68",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]
